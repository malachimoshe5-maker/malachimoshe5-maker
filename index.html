<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אפליקציית סופר ורשימת קניות</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input,
        select {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .item-info img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .completed {
            text-decoration: line-through;
            color: #9ca3af;
        }

        .map-section iframe {
            width: 100%;
            height: 250px;
            border: 0;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🛒 הקניות שלי והסופרים בסביבה</h1>

        <!-- רשימת קניות -->
        <div class="card">
            <h2>רשימת קניות חכמה</h2>
            <div class="input-group">
                <input type="text" id="itemName" placeholder="שם המוצר (למשל: חלב, לחם)...">
                <input type="text" id="itemImage" placeholder="קישור לתמונה (URL)...">
                <button onclick="addItem()">הוסף מוצר</button>
            </div>
            <ul id="shoppingList">
                <!-- כאן יופיעו המוצרים -->
            </ul>
        </div>

        <!-- מפת סופרים באזור -->
        <div class="card map-section">
            <h2>📍 סופרמרקטים בקרבת מקום</h2>
            <p>חפש סופרים פתוחים באזור שלך:</p>
            <!-- מפת גוגל מובנית שמחפשת סופרים -->
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d13523.45!2d34.8!3d32.08!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1zppuretbtv1ctv6yq!5e0!3m2!1she!2sil!4v1234567890"
                allowfullscreen="" loading="lazy">
            </iframe>
        </div>
    </div>

    <script>
        function addItem() {
            const nameInput = document.getElementById('itemName');
            const imageInput = document.getElementById('itemImage');
            const list = document.getElementById('shoppingList');

            if (nameInput.value.trim() === '') return;

            const li = document.createElement('li');

            // תמונת ברירת מחדל אם המשתמש לא הכניס קישור
            const imgSrc = imageInput.value.trim() !== '' ? imageInput.value.trim() : 'https://via.placeholder.com/50?text=Product';

            li.innerHTML = `
                <div class="item-info">
                    <input type="checkbox" onclick="toggleComplete(this)">
                    <img src="${imgSrc}" alt="מוצר">
                    <span>${nameInput.value}</span>
                </div>
                <button onclick="removeItem(this)" style="background-color: #ef4444; padding: 5px 10px; font-size: 14px;">מחק</button>
            `;

            list.appendChild(li);

            nameInput.value = '';
            imageInput.value = '';
        }

        function toggleComplete(checkbox) {
            const span = checkbox.nextElementSibling.nextElementSibling;
            if (checkbox.checked) {
                span.classList.add('completed');
            } else {
                span.classList.remove('completed');
            }
        }

        function removeItem(button) {
            button.parentElement.remove();
        }
    </script>

</body>

</html>
